name: Build images

# One target per run: `infra` or a PHP version. Slots are 2h apart, infra first; the PHP images
# build from the same Dockerfile, so they do not depend on the infra run.
on:
  schedule:
    - cron: '0 22 * * 0'  # infra
    - cron: '0 0 * * 1'   # 8.0
    - cron: '0 2 * * 1'   # 8.1
    - cron: '0 4 * * 1'   # 8.2
    - cron: '0 6 * * 1'   # 8.3
    - cron: '0 8 * * 1'   # 8.4
    - cron: '0 10 * * 1'  # 8.5
  workflow_dispatch:
    inputs:
      php:
        description: 'Target to build'
        type: choice
        options: [infra, '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
  workflow_call:
    inputs:
      php:
        description: 'Target to build: infra or a PHP version'
        type: string
        required: true

# The expression map is the cron -> target lookup that the resolver table below also carries.
concurrency:
  group: build-${{ inputs.php || fromJSON('{"0 22 * * 0":"infra","0 0 * * 1":"8.0","0 2 * * 1":"8.1","0 4 * * 1":"8.2","0 6 * * 1":"8.3","0 8 * * 1":"8.4","0 10 * * 1":"8.5"}')[github.event.schedule] }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      ts: ${{ steps.v.outputs.ts }}
      nodevs: ${{ steps.v.outputs.nodevs }}
      target: ${{ steps.v.outputs.target }}
      php: ${{ steps.v.outputs.php }}
      node: ${{ steps.v.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert Dockerfile is freshly generated
        run: |
          ./generate-dockerfile
          git diff --exit-code Dockerfile \
            || { echo "Dockerfile out of date — run ./generate-dockerfile and commit"; exit 1; }

      - id: v
        run: |
          TABLE='[
            {"target":"infra","cron":"0 22 * * 0"},
            {"target":"8.0","node":"18","cron":"0 0 * * 1"},
            {"target":"8.1","node":"18","cron":"0 2 * * 1"},
            {"target":"8.2","node":"20","cron":"0 4 * * 1"},
            {"target":"8.3","node":"20","cron":"0 6 * * 1"},
            {"target":"8.4","node":"22","cron":"0 8 * * 1"},
            {"target":"8.5","node":"25","cron":"0 10 * * 1"}
          ]'
          entry=$(jq -c --arg t '${{ inputs.php }}' --arg c '${{ github.event.schedule }}' \
            '.[] | select(.target == $t or (($t == "") and .cron == $c))' <<<"$TABLE")
          [ -n "$entry" ] || { echo "No build target for this trigger"; exit 1; }
          target=$(jq -r .target <<<"$entry")
          {
            echo "ts=$(date +%y.%m)"
            echo "nodevs=25"
            echo "target=$target"
            echo "php=$target"
            echo "node=$(jq -r '.node // ""' <<<"$entry")"
          } >> "$GITHUB_OUTPUT"

  infra-build:
    name: Infra build ${{ matrix.role }} ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.target == 'infra'
    permissions: {contents: read, id-token: write, attestations: write}
    strategy:
      fail-fast: false
      matrix:
        role: [base, ci, az-ci]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      REPO: curatorium/${{ matrix.role }}
      X_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.role }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ${{ (matrix.role == 'ci' || matrix.role == 'az-ci') && format('NODEVS={0}', needs.version.outputs.nodevs) || '' }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.REPO }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REPO }}:cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Fetch bash-test
        run: |
          sudo curl -fsSL -o /usr/local/bin/bash-import https://github.com/curatorium/bash-import/releases/download/v1.0.0-alpha.5/bash-import
          sudo curl -fsSL -o /usr/local/bin/bash-test   https://github.com/curatorium/bash-import/releases/download/v1.0.0-alpha.5/bash-test
          sudo chmod +x /usr/local/bin/bash-import /usr/local/bin/bash-test

      - name: Test
        run: IMAGE="$REPO@${{ steps.push.outputs.digest }}" bash-test tests/${{ matrix.role }}.test

      - name: Test service manager (base only)
        if: matrix.role == 'base'
        run: |
          docker run --rm -v "$PWD/tests:/tests" --entrypoint bash \
            "$REPO@${{ steps.push.outputs.digest }}" -c 'bash-test /tests/service.test'

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - run: |
          mkdir -p /tmp/d
          echo -n "${{ steps.push.outputs.digest }}" > "/tmp/d/digest-${{ matrix.role }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with: {name: "digest-${{ matrix.role }}-${{ matrix.arch }}", path: "/tmp/d/digest-${{ matrix.role }}-${{ matrix.arch }}"}

  infra-merge:
    name: Infra merge ${{ matrix.role }}
    needs: [version, infra-build]
    if: needs.version.outputs.target == 'infra'
    permissions: {contents: read, id-token: write, attestations: write}
    strategy:
      fail-fast: false
      matrix:
        role: [base, ci, az-ci]
    runs-on: ubuntu-24.04
    env:
      REPO: curatorium/${{ matrix.role }}
      TS: ${{ needs.version.outputs.ts }}
    steps:
      - uses: docker/login-action@v3
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: /tmp/d, pattern: "digest-${{ matrix.role }}-*", merge-multiple: true}

      - name: Merge per-arch digests
        run: |
          A=$(cat "/tmp/d/digest-${{ matrix.role }}-amd64")
          B=$(cat "/tmp/d/digest-${{ matrix.role }}-arm64")
          docker buildx imagetools create \
            -t "$REPO:$TS" -t "$REPO:latest" \
            "$REPO@$A" "$REPO@$B"

      - id: index
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$REPO:$TS" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$digest" ] || { echo "empty index digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ env.REPO }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  php-build:
    name: Build php-${{ needs.version.outputs.php }} ${{ matrix.role }} ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.target != 'infra'
    permissions: {contents: read, id-token: write, attestations: write}
    strategy:
      fail-fast: false
      matrix:
        role: [base, qa, fs]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      REPO: curatorium/php-${{ needs.version.outputs.php }}
      TAG: ${{ matrix.role }}-${{ needs.version.outputs.ts }}-${{ matrix.arch }}
      X_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: Dockerfile
          target: php-${{ matrix.role }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PHPVS=${{ needs.version.outputs.php }}
            ${{ matrix.role == 'fs' && format('NODEVS={0}', needs.version.outputs.node) || '' }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.REPO }}:${{ matrix.role }}-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REPO }}:${{ matrix.role }}-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Fetch bash-test
        run: |
          sudo curl -fsSL -o /usr/local/bin/bash-import https://github.com/curatorium/bash-import/releases/download/v1.0.0-alpha.5/bash-import
          sudo curl -fsSL -o /usr/local/bin/bash-test   https://github.com/curatorium/bash-import/releases/download/v1.0.0-alpha.5/bash-test
          sudo chmod +x /usr/local/bin/bash-import /usr/local/bin/bash-test

      - name: Test
        run: PHPVS=${{ needs.version.outputs.php }} NODEVS=${{ needs.version.outputs.node }} IMAGE="$REPO@${{ steps.push.outputs.digest }}" bash-test tests/php-${{ matrix.role }}.test

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - run: |
          mkdir -p /tmp/d
          echo -n "${{ steps.push.outputs.digest }}" > "/tmp/d/digest-${{ needs.version.outputs.php }}-${{ matrix.role }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "digest-${{ needs.version.outputs.php }}-${{ matrix.role }}-${{ matrix.arch }}"
          path: "/tmp/d/digest-${{ needs.version.outputs.php }}-${{ matrix.role }}-${{ matrix.arch }}"

  php-merge:
    name: Merge php-${{ needs.version.outputs.php }} ${{ matrix.role }}
    needs: [version, php-build]
    if: needs.version.outputs.target != 'infra'
    permissions: {contents: read, id-token: write, attestations: write}
    strategy:
      fail-fast: false
      matrix:
        role: [base, qa, fs]
    runs-on: ubuntu-24.04
    env:
      REPO: curatorium/php-${{ needs.version.outputs.php }}
      TS: ${{ needs.version.outputs.ts }}
      ROLE: ${{ matrix.role }}
    steps:
      - uses: docker/login-action@v3
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}
      - uses: actions/download-artifact@v4
        with: {path: /tmp/d, pattern: "digest-${{ needs.version.outputs.php }}-${{ matrix.role }}-*", merge-multiple: true}

      - name: Merge per-arch digests
        run: |
          A=$(cat "/tmp/d/digest-${{ needs.version.outputs.php }}-${{ matrix.role }}-amd64")
          B=$(cat "/tmp/d/digest-${{ needs.version.outputs.php }}-${{ matrix.role }}-arm64")
          docker buildx imagetools create \
            -t "$REPO:$ROLE-$TS" -t "$REPO:$ROLE" \
            "$REPO@$A" "$REPO@$B"

      - id: index
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$REPO:$ROLE-$TS" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$digest" ] || { echo "empty index digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ env.REPO }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
