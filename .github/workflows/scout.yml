name: Scout CVE scan

# Scans the published images, so CVEs disclosed since a build surface without a rebuild.
on:
  schedule:
    - cron: '43 12 * * 1'
  workflow_dispatch: ~

permissions:
  contents: read
  security-events: write # upload-sarif → code scanning

jobs:
  scout:
    name: Scout ${{ matrix.php }} ${{ matrix.role }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        # ci and fs together cover every layer: fs ⊃ qa ⊃ base, ci ⊃ base.
        role: [ci, fs]

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}

      # docker/scout-action downloads its binary from GitHub unauthenticated and 403s on the
      # anonymous rate limit (docker/scout-action#116); the scout-cli image comes from Docker Hub.
      - name: Scan
        run: |
          cfg="$RUNNER_TEMP/docker" && mkdir -p "$cfg" && cp ~/.docker/config.json "$cfg/"
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e DOCKER_CONFIG=/docker \
            -v "$cfg:/docker" -v "$PWD:/out" \
            docker/scout-cli:1.30.0 cves "registry://curatorium/php-$PHPVS:$ROLE" \
            --format sarif --output "/out/scout-$PHPVS-$ROLE.sarif"
        env:
          PHPVS: ${{ matrix.php }}
          ROLE: ${{ matrix.role }}

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-${{ matrix.php }}-${{ matrix.role }}.sarif
          category: scout-${{ matrix.php }}-${{ matrix.role }}
